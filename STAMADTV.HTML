<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAMAD TV</title>
<style>
  :root{
    --latar-opacity: 0.5;
    --latar-url: none;
    --biru: #0033a0;
    --merah: #d40000;
    --kuning: #ffcc00;
    --font-tajuk: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    --tinggi-tiker: 56px;
  }
  *{ box-sizing: border-box; }
  html, body { margin:0; padding:0; }
    body{
    min-height:100vh;
    font-family: Verdana, Tahoma, Geneva, sans-serif;
    color:#111;
    position:relative;
    background:#ffffff;
    /* PENTING — ruang untuk tiker atas & bawah */
    padding-top: 64px !important;      /* 56px tinggi tiker + 8px jarak */
    padding-bottom: 64px !important;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image: var(--latar-url);
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;
    opacity: var(--latar-opacity, 0.5);
    pointer-events:none;
  }
  
    .btn-toggle-kiri{
    position: fixed;
    top: 76px;
    left: 8px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(0,51,160,.75);
    color: #fff;
    border: 0;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    z-index: 55;
    opacity: .25;
    transition: opacity .2s;
  }
  .btn-toggle-kiri:hover{ opacity: 1; }
  .susun-utama.panel-kiri-tutup{
    grid-template-columns: 0 minmax(0, 1fr) 200px;
  }
  .susun-utama.panel-kiri-tutup .panel-kiri{
    display: none;
  }
  /* ============ SEMBUNYIKAN SCROLLBAR (Mod TV/Kiosk) ============ */
  html, body {
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* IE / Edge lama */
    overflow-x: hidden;         /* Elak skrol mendatar */
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none;              /* Chrome, Safari, Edge baharu */
    width: 0;
    height: 0;
  }
  /* ============ SUSUN ATUR 3 KOLUM ============ */
  .susun-utama{
    display:grid;
    grid-template-columns: 260px minmax(0, 1fr) 200px;
    gap:5px;
    padding: 3px;
    max-width: 2000px;
    margin: 0 auto;
    align-items:start;
  }
  @media (max-width: 1100px){
    .susun-utama{
      grid-template-columns: 1fr;
    }
  }

  /* ============ KAD CUACA ============ */
  .cuaca-box{
    margin-top: 1px;
    padding: 1px 1px;
    background: linear-gradient(135deg, #e8f0ff 0%, #d0e0ff 100%);
    border-radius: 1px;
    text-align: center;
    border: 1px solid #b8ccf0;
  }
  .cuaca-lokasi{
    font-size: 8px; font-weight: 500; color: #0033a0;
    letter-spacing: .8px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cuaca-suhu{
    font-family: var(--font-tajuk);
    font-size: 30px; line-height: 1; color: #d40000;
  }
  .cuaca-unit{ font-size: 8px; color: #666; }
  .cuaca-ikon{ font-size: 18px; margin: 2px 0; }
  .cuaca-desc{
    font-size: 11px; font-weight: 500; color: #333;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .cuaca-ralat{ font-size: 5px; color: #999; }

  /* ============ TIKER ATAS (RSS) ============ */
  .tiker-atas{
    position: fixed;
    left: 0; right: 0; top: 0;
    height: var(--tinggi-tiker);
    background: linear-gradient(90deg, #001f66 0%, #0033a0 100%);
    display: flex; align-items: center;
    overflow: hidden;
    z-index: 50;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
    border-bottom: 3px solid var(--kuning);
  }
  .tiker-atas .label{
    flex: 0 0 auto;
    background: var(--kuning);
    color: #000;
    height: 100%;
    display: flex; align-items: center;
    padding: 0 16px;
    font-family: var(--font-tajuk);
    font-size: 20px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 2;
    box-shadow: 4px 0 8px rgba(0,0,0,.25);
  }
  .tiker-atas .skrol{
    flex: 1 1 auto;
    overflow: hidden;
    height: 100%;
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .tiker-atas .skrol > span{
    display: inline-block;
    padding-left: 100%;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1px;
    animation: jalan 35s linear infinite;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .tiker-atas.kosong{ display: none; }
  body{ padding-top: var(--tinggi-tiker); }
  
  /* Kad */
  .kad{
    background: rgba(255,255,255,.88);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.16);
  }

  /* ============ KOLUM KIRI ============ */
  .panel-kiri{ grid-column: 1; }

  .tajuk{
    font-family: var(--font-tajuk);
    font-size: 20px;
    text-align: center;
    color: var(--merah);
    letter-spacing: 1px;
    line-height: 1.2;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--merah);
    text-shadow:
      1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff,
      0 2px 6px rgba(0,0,0,.15);
  }
  .logo{
    display:block; margin: 0 auto 8px;
    width: 76px; height: 76px; object-fit: contain;
  }
  .moto{
    font-size: 13px; font-weight: 700; text-align:center;
    color:#333; letter-spacing:.6px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .gps-item{ text-align:center; padding: 6px 0; }
  .gps-label{
    font-size: 20px; font-weight:700; color: var(--biru);
    letter-spacing:.6px; text-transform: uppercase;
  }
  .gps-nilai{
    font-family: var(--font-tajuk);
    font-size: 55px; line-height: 1.05; color: var(--merah);
  }
  .solat-box{ margin-top: 8px; }
  .solat{ display:block; width:100%; height:220px; border:0; border-radius:8px; }

  .masa-kini{
    margin-top: 12px;
    padding: 10px 8px;
    background: linear-gradient(135deg, #0033a0 0%, #001f66 100%);
    border-radius: 12px;
    text-align: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.22);
  }
  .masa-jam{
    font-family: var(--font-tajuk);
    font-size: 34px;
    line-height: 1;
    letter-spacing: 1.5px;
    color: #ffcc00;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .masa-tarikh{
    font-size: 12px; font-weight: 700;
    margin-top: 6px; letter-spacing: .5px;
    color: #ffffff; text-transform: uppercase;
  }

  /* ============ KOLUM TENGAH ============ */
  .panel-tengah{
    grid-column: 2;
    display:flex; flex-direction:column; gap:16px;
    min-width: 0;
  }
  .bingkai-slaid iframe{
    display:block; width:100%;
    height: clamp(780px, 55vh, 780px);
    border:0; border-radius:10px;
  }
  .bingkai-sheet iframe{
    display:block; width:100%; height: 400px;
    border:0; border-radius:10px;
  }

  /* ============ KOLUM KANAN (COUNTDOWN MENEGAK) ============ */
  .panel-kanan{
    grid-column: 3;
    padding: 12px 10px;
  }
  .panel-kanan .tajuk-kecil{
    text-align:center;
    font-family: var(--font-tajuk);
    font-size: 20px;
    color: var(--biru);
    letter-spacing: 1px;
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid #e6ecf5;
    text-transform: uppercase;
  }
  .cd-grid{
    display:flex; flex-direction:column; gap:10px;
  }
  .cd-item{
    background: rgba(255,255,255,.92);
    border-radius: 12px;
    padding: 10px 8px;
    text-align:center;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    border-left: 5px solid var(--biru);
  }
  .cd-label{
    font-size: 20px; font-weight:800; color: var(--biru);
    text-transform: uppercase; letter-spacing:.6px;
  }
  .cd-nilai{
    font-family: var(--font-tajuk);
    font-size: 60px; line-height:1; color: var(--merah);
    margin-top: 2px;
  }
  .cd-unit{
    font-size: 10px; font-weight:700; color:#555;
    letter-spacing:2px; text-transform:uppercase;
  }
  .cd-tarikh{
    font-size: 10px;
    color:#555;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed #c8d2e2;
    font-weight: 700;
    line-height: 1.3;
  }
  .cd-item.cd-tamat{ border-left-color:#888; opacity:.55; }

  /* ============ TEKS BERJALAN (TIKER BAWAH) ============ */
  .teks-berjalan{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: var(--tinggi-tiker);
    background: linear-gradient(90deg, #0033a0 0%, #d40000 100%);
    display:flex; align-items:center;
    overflow:hidden;
    z-index: 50;
    box-shadow: 0 -4px 14px rgba(0,0,0,.28);
    border-top: 3px solid var(--kuning);
  }
  .teks-berjalan .label{
    flex: 0 0 auto;
    background: var(--kuning);
    color: #000;
    height: 100%;
    display:flex; align-items:center;
    padding: 0 16px;
    font-family: var(--font-tajuk);
    font-size: 20px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 2;
    box-shadow: 4px 0 8px rgba(0,0,0,.25);
  }
  .teks-berjalan .skrol{
    flex: 1 1 auto;
    overflow:hidden;
    height: 100%;
    display:flex; align-items:center;
    white-space: nowrap;
  }
  .teks-berjalan .skrol > span{
    display:inline-block;
    padding-left: 100%;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1px;
    animation: jalan 25s linear infinite;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  @keyframes jalan{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  .teks-berjalan.kosong{ display:none; }

  /* Butang admin */
    .admin-link{
    position:fixed; bottom:70px; right:10px;   /* tukar ke kanan bawah */
    font-size: 18px; text-decoration:none;
    opacity:.15; transition: opacity .2s; z-index: 60;
  }
  .admin-link:hover{ opacity:1; }
</style>
</head>
<body>
  <button class="btn-toggle-kiri" id="btnToggleKiri" title="Sembunyi/Tunjuk Panel Kiri">◀</button>
  <!-- ============ TIKER BERITA (ATAS) ============ -->
  <div class="tiker-atas" id="tikerAtas">
    <div class="label">BERITA</div>
    <div class="skrol"><span id="teksRSS">Memuatkan berita…</span></div>
  </div>
  <a class="admin-link" href="admin.html" title="Admin">&#9881;</a>

  <div class="susun-utama">

    <!-- ============ KOLUM 1 : KIRI ============ -->
    <aside class="panel-kiri kad">
      <h1 class="tajuk" id="tajuk"></h1>
      <img id="logo" class="logo" src="" alt="Logo">
      <div class="moto" id="moto"></div>
      <div id="gpsBox"></div>
	        <div class="cuaca-box" id="cuacaBox">
        <div class="cuaca-lokasi" id="cuacaLokasi">—</div>
        <div class="cuaca-ikon" id="cuacaIkon">🌡️</div>
        <div class="cuaca-suhu"><span id="cuacaSuhu">--</span><span class="cuaca-unit">°C</span></div>
        <div class="cuaca-desc" id="cuacaDesc">—</div>
      </div>
      <div class="solat-box" id="solatBox"></div>
      <div class="masa-kini">
        <div class="masa-jam"><span id="jamSemasa">--:--:--</span></div>
        <div class="masa-tarikh" id="tarikhSemasa">—</div>
      </div>
    </aside>

    <!-- ============ KOLUM 2 : TENGAH ============ -->
    <section class="panel-tengah">
      <div class="bingkai-slaid kad" id="slaidBox">
        <iframe id="slaidFrame" src="about:blank" allowfullscreen="true"
                mozallowfullscreen="true" webkitallowfullscreen="true" loading="lazy"></iframe>
      </div>
      <div class="bingkai-sheet kad" id="sheetBox">
        <iframe id="sheetFrame" src="about:blank" loading="lazy"></iframe>
      </div>
    </section>

    <!-- ============ KOLUM 3 : KANAN (COUNTDOWN MENEGAK) ============ -->
    <aside class="panel-kanan kad" id="cdPanel">
      
      <div class="cd-grid" id="cdGrid"></div>
    </aside>

  </div>

  <!-- ============ TEKS BERJALAN ============ -->
  <div class="teks-berjalan" id="teksBerjalan">
    <div class="label">INFO</div>
    <div class="skrol"><span id="teksSkrol"></span></div>
  </div>


<script>
(function () {
  "use strict";

  var STORAGE_KEY = "stamad_config_v1";

  var DEFAULTS = {
    tajuk: "PAPARAN INFORMASI DIGITAL SEKOLAH MENENGAH KEBANGSAAN SULTAN AHMAD",
    moto: "STAMAD SHOOT TO THE TOP!",
    logoUrl: "ROCKET.PNG",
    gps: [
      { label: "GPS SPM",  nilai: "4.48" },
      { label: "GPS STPM", nilai: "3.16" }
    ],
    countdown: [
      { label: "SPM",     tarikh: "2026-12-07T15:37" },
      { label: "STPM S1", tarikh: "2027-01-21T15:37" },
      { label: "STPM S2", tarikh: "2027-06-29T15:37" },
      { label: "STPM S3", tarikh: "2027-01-20T15:37" }
    ],
    slaidUrl: "https://docs.google.com/presentation/d/e/2PACX-1vSfjpse1th_fFLos1EpCjqOjREOcpPgMzVstWYzK7caXk8IL0H60zJt7G3GWKT8u-y5y4ggBSpyaFp7/pubembed?start=true&loop=true&delayms=5000",
    sheetUrl: "",
    solatUrl: "https://www.e-solat.gov.my/portalassets/www2/solatC.php?kod=TRG01&lang=BM&url=http:/www.islam.gov.my",
    latarUrl: "",
    latarOpacity: 0.5,
    refreshSaat: 253,
    teksBerjalan: "Selamat datang ke STAMAD TV • Sila ikuti pengumuman terkini di papan info • STAMAD SHOOT TO THE TOP!",
    /* --- BAHARU: Cuaca --- */
    cuacaLokasi: "Kuala Terengganu",
    cuacaLat: 5.3302,
    cuacaLon: 103.1408,
    cuacaAktif: true,
    /* --- BAHARU: RSS --- */
    rssUrl: "https://www.thestar.com.my/RSS/News/Education",
    rssAktif: true
  };
    /* TOGGLE PANEL KIRI */
  (function(){
    var btn = document.getElementById("btnToggleKiri");
    var susun = document.querySelector(".susun-utama");
    if (!btn || !susun) return;
    btn.addEventListener("click", function(){
      susun.classList.toggle("panel-kiri-tutup");
      btn.textContent = susun.classList.contains("panel-kiri-tutup") ? "▶" : "◀";
    });
  })();

  /* ============ MUAT KONFIGURASI ============ */
  function muatConfig() {
    return fetch('save.php?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (dariServer) {
        var dariLocal = {};
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) dariLocal = JSON.parse(raw) || {};
        } catch (e) {}
        var out = {}, k;
        for (k in DEFAULTS)  out[k] = DEFAULTS[k];
        for (k in dariLocal) if (dariLocal[k] !== undefined && dariLocal[k] !== null) out[k] = dariLocal[k];
        if (dariServer && typeof dariServer === 'object') {
          for (k in dariServer) if (dariServer[k] !== undefined && dariServer[k] !== null) out[k] = dariServer[k];
        }
        return out;
      });
  }

  function el(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  /* ============ KOD CUACA → IKON & DESKRIPSI ============ */
  var CUACA_KOD = {
    0:["Cerah","☀️"], 1:["Cerah Berawan","🌤️"], 2:["Berawan","⛅"], 3:["Mendung","☁️"],
    45:["Berkabus","🌫️"], 48:["Berkabus Tebal","🌫️"],
    51:["Gerimis Ringan","🌦️"], 53:["Gerimis","🌦️"], 55:["Gerimis Lebat","🌧️"],
    61:["Hujan Ringan","🌧️"], 63:["Hujan","🌧️"], 65:["Hujan Lebat","🌧️"],
    71:["Salji Ringan","❄️"], 73:["Salji","❄️"], 75:["Salji Lebat","❄️"],
    80:["Hujan Lokal","🌦️"], 81:["Hujan Lokal Lebat","🌧️"], 82:["Hujan Sangat Lebat","⛈️"],
    95:["Ribut Petir","⛈️"], 96:["Ribut + Hail","⛈️"], 99:["Ribut Teruk","⛈️"]
  };

  function dapatkanCuaca(lat, lon, lokasi) {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
              "&longitude=" + lon + "&current=temperature_2m,weather_code" +
              "&timezone=Asia%2FKuala_Lumpur";
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.current) throw new Error("Tiada data");
        var suhu = Math.round(d.current.temperature_2m);
        var kod = d.current.weather_code;
        var info = CUACA_KOD[kod] || ["—","🌡️"];
        el("cuacaLokasi").textContent = lokasi || "—";
        el("cuacaSuhu").textContent = suhu;
        el("cuacaIkon").textContent = info[1];
        el("cuacaDesc").textContent = info[0];
      })
      .catch(function () {
        el("cuacaDesc").innerHTML = '<span class="cuaca-ralat">Cuaca tidak tersedia</span>';
      });
  }

  /* ============ TIKER RSS ============ */
  function muatRSS(rssUrl) {
    if (!rssUrl) return;
    // Guna RSS2JSON untuk elak CORS
    var api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
    fetch(api)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.items || !d.items.length) throw new Error("Tiada item");
        var teks = d.items.slice(0, 10).map(function (it) {
          return (it.title || "").replace(/\s+/g, " ").trim();
        }).filter(Boolean).join("  •  ");
        if (!teks) throw new Error("Kosong");
        el("teksRSS").textContent = teks;
        // Halaju berkadar panjang teks
        var durasi = Math.max(25, teks.length * 0.18);
        el("teksRSS").style.animationDuration = durasi + "s";
      })
      .catch(function () {
        el("teksRSS").textContent = "Berita tidak dapat dimuatkan. Sila semak URL RSS di admin page.";
      });
  }

  /* ============ MULA ============ */
  muatConfig().then(function (cfg) {
    /* 1. TAJUK */
    el("tajuk").textContent = cfg.tajuk;
    document.title = "STAMAD TV";

    /* 2. LATAR */
    var latar = (cfg.latarUrl || "").trim();
    if (latar) {
      document.documentElement.style.setProperty("--latar-url",
        'url("' + latar.replace(/"/g,'\\"') + '")');
    } else {
      document.documentElement.style.setProperty("--latar-url", "none");
    }
    var op = parseFloat(cfg.latarOpacity);
    if (isNaN(op)) op = 0.5;
    op = Math.min(Math.max(op, 0), 1);
    document.documentElement.style.setProperty("--latar-opacity", String(op));

    /* 3. LOGO & MOTO */
    var logo = el("logo");
    if (cfg.logoUrl) logo.src = cfg.logoUrl; else logo.style.display = "none";
    el("moto").textContent = cfg.moto || "";

    /* 4. GPS */
    var gpsBox = el("gpsBox");
    var gpsArr = Array.isArray(cfg.gps) ? cfg.gps : [];
    if (gpsArr.length) {
      gpsBox.innerHTML = gpsArr.map(function (g) {
        return '<div class="gps-item">' +
                 '<div class="gps-label">' + esc(g.label) + '</div>' +
                 '<div class="gps-nilai">' + esc(g.nilai) + '</div>' +
               '</div>';
      }).join("");
    } else gpsBox.style.display = "none";

    /* 5. CUACA */
    if (cfg.cuacaAktif !== false) {
      dapatkanCuaca(cfg.cuacaLat, cfg.cuacaLon, cfg.cuacaLokasi);
      // Kemaskini setiap 15 minit
      setInterval(function () {
        dapatkanCuaca(cfg.cuacaLat, cfg.cuacaLon, cfg.cuacaLokasi);
      }, 15 * 60 * 1000);
    } else {
      el("cuacaBox").style.display = "none";
    }

    /* 6. WAKTU SOLAT */
    var solatBox = el("solatBox");
    if (cfg.solatUrl) {
      solatBox.innerHTML = '<iframe class="solat" src="' + esc(cfg.solatUrl) +
                           '" frameborder="0" scrolling="no" loading="lazy"></iframe>';
    } else solatBox.style.display = "none";

    /* 7. TARIKH & MASA SEMASA */
    var HARI = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
    var BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];
    function dua(n){ return String(n).padStart(2,"0"); }
    function kemasMasa(){
      var d = new Date();
      el("jamSemasa").textContent = dua(d.getHours()) + ":" + dua(d.getMinutes()) + ":" + dua(d.getSeconds());
      el("tarikhSemasa").textContent =
        HARI[d.getDay()] + ", " + dua(d.getDate()) + " " + BULAN[d.getMonth()] + " " + d.getFullYear();
    }
    kemasMasa();
    setInterval(kemasMasa, 1000);

    /* 8. SLAID */
    if (cfg.slaidUrl) el("slaidFrame").src = cfg.slaidUrl;
    else el("slaidBox").style.display = "none";

    /* 9. SHEET */
    if (cfg.sheetUrl) el("sheetFrame").src = cfg.sheetUrl;
    else el("sheetBox").style.display = "none";

    /* 10. COUNTDOWN */
    var cdData = [];
    function formatTarikh(d){
      try {
        var t = d.toLocaleDateString("ms-MY", { day:"2-digit", month:"short", year:"numeric" });
        var j = d.toLocaleTimeString("ms-MY", { hour:"2-digit", minute:"2-digit", hour12:true });
        return t + " • " + j;
      } catch(e){ return d.toLocaleString(); }
    }
    function binaCountdown(){
      var grid = el("cdGrid");
      grid.innerHTML = "";
      cdData = [];
      var arr = Array.isArray(cfg.countdown) ? cfg.countdown : [];
      arr.forEach(function (c) {
        if (!c || !c.tarikh) return;
        var target = new Date(c.tarikh);
        if (isNaN(target.getTime())) return;
        var div = document.createElement("div");
        div.className = "cd-item";
        div.innerHTML =
          '<div class="cd-label">' + esc(c.label || "") + '</div>' +
          '<div class="cd-nilai">–</div>' +
          '<div class="cd-unit">hari</div>' +
          '<div class="cd-tarikh">' + esc(formatTarikh(target)) + '</div>';
        grid.appendChild(div);
        cdData.push({
          root: div,
          nilai: div.querySelector(".cd-nilai"),
          target: target.getTime()
        });
      });
      if (!cdData.length) el("cdPanel").style.display = "none";
      kemasCountdown();
    }
    function kemasCountdown(){
      var now = Date.now();
      cdData.forEach(function (it) {
        var beza = it.target - now;
        if (beza <= 0) {
          it.nilai.textContent = "0";
          it.root.classList.add("cd-tamat");
          return;
        }
        it.nilai.textContent = Math.floor(beza / 86400000);
      });
    }
    binaCountdown();
    setInterval(kemasCountdown, 1000);

    /* 11. TEKS BERJALAN (BAWAH) */
    var teks = (cfg.teksBerjalan || "").trim();
    if (teks) {
      el("teksSkrol").textContent = teks;
      var durasi = Math.max(15, teks.length * 0.22);
      el("teksSkrol").style.animationDuration = durasi + "s";
    } else {
      el("teksBerjalan").classList.add("kosong");
    }

    /* 12. TIKER RSS (ATAS) */
    if (cfg.rssAktif !== false && cfg.rssUrl) {
      muatRSS(cfg.rssUrl);
      // Muat semula setiap 10 minit
      setInterval(function () { muatRSS(cfg.rssUrl); }, 10 * 60 * 1000);
    } else {
      el("tikerAtas").classList.add("kosong");
    }

    /* 13. AUTO REFRESH */
    var saat = parseInt(cfg.refreshSaat, 10);
    if (saat > 0) {
      var m = document.createElement("meta");
      m.httpEquiv = "refresh";
      m.content = String(saat);
      document.head.appendChild(m);
    }
  });
})();
</script>
</body>
</html>
